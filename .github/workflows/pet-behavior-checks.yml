name: Pet behavior checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project entry points
        run: python -m py_compile pet_behavior_gradio_app.py start_app.py setup_environment.py train.py

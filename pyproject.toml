[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-behavior-monitoring"
version = "0.1.0"
description = "Local pet behavior analysis and environmental linkage demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "catiseyeqaq" }]
dependencies = [
    "gradio>=4.44.0,<6.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pyserial>=3.5",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.4.0",
]

[project.urls]
Homepage = "https://github.com/catiseyeqaq/Real-time-Monitoring-and-Analysis-of-Pet-Behavior"
Source = "https://github.com/catiseyeqaq/Real-time-Monitoring-and-Analysis-of-Pet-Behavior"
Issues = "https://github.com/catiseyeqaq/Real-time-Monitoring-and-Analysis-of-Pet-Behavior/issues"

[project.scripts]
pet-behavior-monitor = "pet_behavior_gradio_app:main"

[tool.ruff]
line-length = 120
